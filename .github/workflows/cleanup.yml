name: Cleanup Old Docker Images

on:
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨 2 点自动触发清理
  workflow_dispatch:     # 手动触发按钮

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write    # 核心：必须赋予该脚本删除包的权限

    steps:
      - name: Delete untagged images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user                          # v3.x 语法：个人账号固定填 user（不要改），组织账号填组织名
          token: ${{ secrets.GITHUB_TOKEN }}     # Github 自动提供的 Token
          image-names: otc-rate-gateway          # 你的镜像名称
          cut-off: 1m                            # 删除 1 分钟之前的垃圾
          tag-selection: untagged                # v3.x 语法：只选中没有标签的游离镜像，绝不碰 latest
