name: Cleanup Old Docker Images

on:
  schedule:
    - cron: '0 2 * * 0'   # 每周日 02:00 清理游离镜像
  workflow_dispatch:

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ github.event.repository.name }}-spider
          cut-off: 1h
          tag-selection: untagged
