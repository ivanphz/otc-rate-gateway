name: Deploy Worker

on:
  push:
    branches:
      - main
    # 👇 新增：精准路径过滤
    paths:
      - 'src/worker-entry.js'
      - 'src/fetch_usd.js'
      - 'src/fetch_usdt.js'
      - 'src/utils.js'
      - 'src/config.js'
      - 'wrangler.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    steps:
      # 把 v3 升级到 v4，彻底解决 Node.js 20 警告
      - uses: actions/checkout@v4
      
      - name: Publish Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # 增加这一行，强制插件使用最新的 wrangler 版本，消除过时警告
          wranglerVersion: '4' 
          command: deploy src/worker-entry.js --name rate-api --compatibility-date 2026-06-10
